
name: Build PrayerTimeBlocker APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: PrayerTimeBlocker-delay3-block5/PrayerTimeBlocker
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimeBlocker-APK
          path: PrayerTimeBlocker-delay3-block5/PrayerTimeBlocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
